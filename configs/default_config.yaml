---
defaults:
  - wandb: defaults
  - hydra: defaults
  - cam_embd: defaults
  - _self_
general:
  device: 0
  random_seed: 0
  num_devices: 1
  mixed_precision: false
data:
  training_resolution: 128
  subset: -1
  input_images: 1
  origin_distances: false
opt:
  iterations: 800001
  base_lr: 0.00005
  batch_size: 8
  betas:
    - 0.9
    - 0.999
  loss: l2
  imgs_per_obj: 4
  ema: 
    use: true
    update_every: 10
    update_after_step: 100
    beta: 0.9999
  lambda_lpips: 0.0
  pretrained_ckpt: null
  # when fine-tuning from pretrained_ckpt: start the "best validation PSNR" at 0,
  # so that the fine-tuned run saves its own model_best.pth
  reset_best_psnr: true
  # symmetry extension (only used if model.symmetry.enabled)
  lambda_plane: 0.1      # weight of the mirror-plane loss
  sym_lr: 0.0001         # learning rate of the two new heads (they start from scratch)

model:
  max_sh_degree: 1
  inverted_x: false
  inverted_y: true
  name: SingleUNet
  opacity_scale: 1.0
  opacity_bias: -2.0
  scale_bias: 0.02
  scale_scale: 0.003
  xyz_scale: 0.1
  xyz_bias: 0.0
  depth_scale: 1.0
  depth_bias: 0.0
  network_without_offset: false
  network_with_offset: true
  attention_resolutions:
  - 16
  num_blocks: 4
  cross_view_attention: true
  base_dim: 128
  isotropic: false
  # symmetry extension: predicted mirror plane + mirrored twin Gaussians
  symmetry:
    enabled: false
    switch_bias: -2.0      # twins start mostly off: sigmoid(-2) = 0.12
    gt_plane_iters: 5000   # mirror with the TRUE plane for the first N training steps
    plane_detach: false    # plane head reads feat.detach(): plane loss cannot reach the U-Net trunk
    near_side_only: false  # twins only for Gaussians on the camera's side of the plane
    plane_gate_deg: 0.0    # >0: keep training with the TRUE plane until the predicted plane's
                           # running angle error is below this many degrees (0 = off)

logging:
  ckpt_iterations: 1000
  val_log: 10000
  loss_log: 10
  loop_log: 10000
  render_log: 10000
